<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0E121D" />
      <stop offset="100%" stop-color="#05070A" />
    </linearGradient>

    <!-- Border Gradient -->
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="50%" stop-color="#6366F1" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#0EA5E9" />
    </linearGradient>

    <!-- Q Gradient -->
    <linearGradient id="qGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="60%" stop-color="#E2E8F0" />
      <stop offset="100%" stop-color="#38BDF8" />
    </linearGradient>

    <!-- H Gradient -->
    <linearGradient id="hGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#818CF8" />
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="cyanGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Base Badge Card -->
  <rect x="8" y="8" width="184" height="184" rx="36" fill="url(#bgGrad)" stroke="url(#borderGrad)" stroke-width="3" />
  
  <!-- Subtle Inner Tech Grid Accent -->
  <line x1="8" y1="100" x2="32" y2="100" stroke="#38BDF8" stroke-width="2" stroke-opacity="0.4" />
  <line x1="168" y1="100" x2="192" y2="100" stroke="#38BDF8" stroke-width="2" stroke-opacity="0.4" />
  <circle cx="100" cy="20" r="2.5" fill="#38BDF8" opacity="0.6" />
  <circle cx="100" cy="180" r="2.5" fill="#38BDF8" opacity="0.6" />

  <!-- Monogram Group (Centered) -->
  <g transform="translate(26, 42)">
    <!-- Modern Geometric 'Q' -->
    <!-- Q Ring -->
    <path d="M 52,10 C 26,10 8,28 8,58 C 8,88 26,106 52,106 C 64,106 74,101 82,93 L 88,103 C 90,106 94,106 97,103 C 99,100 99,96 96,93 L 88,83 C 94,76 96,67 96,58 C 96,28 78,10 52,10 Z M 52,30 C 67,30 76,42 76,58 C 76,74 67,86 52,86 C 37,86 28,74 28,58 C 28,42 37,30 52,30 Z" 
          fill="url(#qGrad)" />

    <!-- Qubit Quantum Particle in Q's Core -->
    <circle cx="52" cy="58" r="5" fill="#38BDF8" filter="url(#cyanGlow)" />

    <!-- Modern Geometric 'H' -->
    <path d="M 108,12 C 108,8.5 110.5,6 114,6 C 117.5,6 120,8.5 120,12 L 120,50 L 140,50 L 140,12 C 140,8.5 142.5,6 146,6 C 149.5,6 152,8.5 152,12 L 152,104 C 152,107.5 149.5,110 146,110 C 142.5,110 140,107.5 140,104 L 140,68 L 120,68 L 120,104 C 120,107.5 117.5,110 114,110 C 110.5,110 108,107.5 108,104 Z" 
          fill="url(#hGrad)" />
  </g>
</svg>